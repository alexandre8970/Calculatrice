<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculatrice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="../assets/css/styles.css">
 
</head>
<body>

<div class="calculator">
  <!-- Affichage de la calculatrice -->
  <input type="text" id="display" class="calculator-display" disabled />

  <!-- Boutons de la calculatrice -->
  <div class="row g-2">
    <div class="col-3"><button class="button clear">C</button></div>
    <div class="col-3"><button class="button function">%</button></div>
    <div class="col-3"><button class="button function">/</button></div>
    <div class="col-3"><button class="button function">←</button></div>

    <div class="col-3"><button class="button">7</button></div>
    <div class="col-3"><button class="button">8</button></div>
    <div class="col-3"><button class="button">9</button></div>
    <div class="col-3"><button class="button function">x</button></div>

    <div class="col-3"><button class="button">4</button></div>
    <div class="col-3"><button class="button">5</button></div>
    <div class="col-3"><button class="button">6</button></div>
    <div class="col-3"><button class="button function">-</button></div>

    <div class="col-3"><button class="button">1</button></div>
    <div class="col-3"><button class="button">2</button></div>
    <div class="col-3"><button class="button">3</button></div>
    <div class="col-3"><button class="button function">+</button></div>

    <div class="col-6"><button class="button">0</button></div>
    <div class="col-3"><button class="button function">.</button></div>
    <div class="col-3"><button class="button equal">=</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
